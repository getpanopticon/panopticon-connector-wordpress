; PHP settings for the integration test site.
; Tuned for a test environment, not production.

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 32M
post_max_size = 40M

; Keep error output out of the replies, so tests see what Panopticon would see. Errors go to a log in the web root
; instead, which the tests read from the host (AbstractE2ETestCase::phpErrorsSince()).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/wp-content/e2e-php-errors.log
error_reporting = E_ALL & ~E_DEPRECATED

expose_php = Off
date.timezone = UTC

; Revalidate the opcache on every request, so files the tests change after the site has served requests (fixture
; plugins, update packages) take effect immediately.
opcache.enable = On
opcache.validate_timestamps = On
opcache.revalidate_freq = 0
