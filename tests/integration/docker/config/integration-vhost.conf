# Virtual host for the throwaway WordPress site under test.

ServerName localhost
DocumentRoot "/var/www/html"

DirectoryIndex index.php index.html

<Directory "/var/www/html">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Hand every PHP request to the php-fpm container over FastCGI. Both containers
# share the same /var/www/html bind mount, so SCRIPT_FILENAME resolves there.
<FilesMatch \.php$>
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>

# Apache drops the Authorization header before it reaches PHP-FPM, unless told otherwise. The Connector accepts its
# token in it (Authorization: Bearer), and so does Panopticon send it.
SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
